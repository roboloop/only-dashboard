name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint (oxlint)
        run: npx oxlint .

      - name: Lint (eslint)
        run: npx eslint .

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build-only
